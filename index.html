<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Knowledge Base</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <script>
    const SUPABASE_URL = 'https://wswhxeagkqaqggilbnmk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_lgVCXvLGHSPfLfF_gkRXnA_hoUX2Sq-';
    
    // Initialize Supabase Client
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Global App State Variables
    let currentUser = null;
    let userRole = 'IT Staff';
    let currentCategory = 'All';
  </script>

  <!-- 1. FULLSCREEN AUTHENTICATION PAGE -->
  <div id="authView" class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
      <div class="text-center mb-6">
        <div class="inline-block bg-indigo-600 text-white p-3 rounded-xl font-bold text-2xl mb-2">IT</div>
        <h2 class="text-2xl font-bold text-slate-800">Knowledge Base</h2>
        <p class="text-slate-500 text-sm mt-1">Sign in or create an account to proceed</p>
      </div>

      <!-- TOGGLE TABS -->
      <div class="flex border-b border-slate-200 mb-6">
        <button id="tabLoginBtn" type="button" onclick="switchAuthTab('login')" class="flex-1 py-2 font-semibold text-indigo-600 border-b-2 border-indigo-600 transition">Login</button>
        <button id="tabRegisterBtn" type="button" onclick="switchAuthTab('register')" class="flex-1 py-2 font-semibold text-slate-400 hover:text-slate-600 transition">Register</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" onsubmit="handleLogin(event); return false;" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" id="loginEmail" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input type="password" id="loginPassword" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition">Sign In</button>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" onsubmit="handleRegister(event); return false;" class="space-y-4 hidden">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" id="regEmail" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input type="password" id="regPassword" required minlength="6" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Role</label>
          <select id="regRole" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
            <option value="IT Staff">IT Staff</option>
            <option value="IT Senior">IT Senior</option>
            <option value="Supervisor">Supervisor</option>
            <option value="Admin">Admin</option>
          </select>
        </div>
        <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition">Create Account</button>
      </form>
    </div>
  </div>

  <!-- 2. MAIN APP CONTENT -->
  <div id="appContainer" class="hidden">
    <!-- NAVBAR -->
    <nav class="bg-slate-900 text-white p-4 shadow-lg flex justify-between items-center sticky top-0 z-50">
      <div class="flex items-center gap-3 cursor-pointer" onclick="showView('dashboardView')">
        <div class="bg-indigo-600 p-2 rounded-lg font-bold">IT</div>
        <h1 class="text-xl font-bold tracking-wide">Knowledge Base</h1>
      </div>
      
      <div id="navRight" class="flex gap-3 items-center">
        <span id="userBadge" class="text-xs bg-slate-800 px-3 py-1 rounded-full border border-slate-700"></span>
        <button id="authBtn" onclick="handleLogout()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm font-semibold transition">Logout</button>
      </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto p-6">

      <!-- TOP CONTROL BAR -->
      <div class="flex flex-col md:flex-row justify-between gap-4 mb-8">
        <!-- Search Bar -->
        <div class="relative flex-1">
          <input type="text" id="searchInput" oninput="fetchArticles()" placeholder="Search KB articles..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <svg class="w-5 h-5 absolute left-3 top-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-2">
          <button id="historyBtn" onclick="openApprovalHistory()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-xl font-medium shadow-sm transition hidden items-center gap-2">
            📜 History Log
          </button>
          <button onclick="openNewArticleModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl font-medium shadow-sm transition flex items-center gap-2">
            <span>+ Add Knowledge</span>
          </button>
        </div>
      </div>

      <!-- CATEGORY FILTERS -->
      <div class="flex gap-2 overflow-x-auto pb-4 mb-6 border-b border-slate-200">
        <button onclick="filterCategory('All')" class="cat-btn active bg-indigo-600 text-white px-4 py-1.5 rounded-full text-sm font-medium">All</button>
        <button onclick="filterCategory('Networking')" class="cat-btn bg-white border border-slate-300 px-4 py-1.5 rounded-full text-sm font-medium">Networking</button>
        <button onclick="filterCategory('Hardware')" class="cat-btn bg-white border border-slate-300 px-4 py-1.5 rounded-full text-sm font-medium">Hardware</button>
        <button onclick="filterCategory('Software')" class="cat-btn bg-white border border-slate-300 px-4 py-1.5 rounded-full text-sm font-medium">Software</button>
        <button onclick="filterCategory('Security')" class="cat-btn bg-white border border-slate-300 px-4 py-1.5 rounded-full text-sm font-medium">Security</button>
        <button id="queueTab" onclick="filterCategory('Queue')" class="cat-btn bg-amber-100 text-amber-800 border border-amber-300 px-4 py-1.5 rounded-full text-sm font-medium hidden"> Review Queue (<span id="queueCount">0</span>)</button>
      </div>

      <!-- VIEW 1: DASHBOARD / ARTICLES GRID -->
      <section id="dashboardView" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Dynamic Article Cards Load Here -->
      </section>

      <!-- VIEW 2: ARTICLE READER VIEW -->
      <section id="articleView" class="hidden bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
        <button onclick="showView('dashboardView')" class="text-sm text-indigo-600 font-semibold mb-4 inline-flex items-center gap-1">&larr; Back to Articles</button>
        <div id="articleDetail"></div>
      </section>

    </main>
  </div>

  <!-- MODAL: ADD ARTICLE -->
  <div id="articleModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex justify-center items-center p-4 z-50">
    <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl p-6 relative">
      <h3 class="text-xl font-bold mb-4">Submit New Knowledge Base Article</h3>
      <form id="articleForm" onsubmit="handleArticleSubmit(event); return false;" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Title</label>
          <input type="text" id="artTitle" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Category</label>
          <select id="artCategory" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
            <option>Networking</option>
            <option>Hardware</option>
            <option>Software</option>
            <option>Security</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Attach Image</label>
          <input type="file" id="artImage" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Content (Markdown / Detailed Procedure)</label>
          <textarea id="artContent" rows="6" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>
        <p class="text-xs text-amber-600 font-medium">* Note: Article will be sent to the Supervisor Review Queue before publishing.</p>
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closeModal('articleModal')" class="px-4 py-2 text-slate-600">Cancel</button>
          <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-medium">Submit for Approval</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: APPROVAL HISTORY LOG -->
  <div id="historyModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex justify-center items-center p-4 z-50">
    <div class="bg-white w-full max-w-3xl rounded-2xl shadow-2xl p-6 relative max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold text-slate-800">Supervisor Approval History Log</h3>
        <button onclick="closeModal('historyModal')" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
      </div>
      <div id="historyList" class="overflow-y-auto flex-1 space-y-3 pr-2">
        <!-- Dynamic logs load here -->
      </div>
    </div>
  </div>

  <!-- MODAL: IMAGE EXPAND LIGHTBOX -->
  <div id="imageLightbox" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md hidden flex flex-col justify-center items-center p-4 z-50 cursor-pointer" onclick="closeImageLightbox()">
    <div class="relative max-w-5xl max-h-[90vh]" onclick="event.stopPropagation()">
      <button onclick="closeImageLightbox()" class="absolute -top-10 right-0 text-white hover:text-slate-300 font-bold text-sm bg-slate-800/80 px-3 py-1 rounded-full border border-slate-600 transition">✕ Close</button>
      <img id="lightboxImage" src="" class="max-w-full max-h-[85vh] rounded-xl shadow-2xl object-contain border border-slate-700">
    </div>
  </div>

  <!-- APPLICATION LOGIC -->
  <script>
    // VIEW SWITCHER
    function showView(viewId) {
      document.getElementById('dashboardView').classList.add('hidden');
      document.getElementById('articleView').classList.add('hidden');
      document.getElementById(viewId).classList.remove('hidden');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.add('hidden');
    }

    function openNewArticleModal() {
      document.getElementById('articleModal').classList.remove('hidden');
    }

    // IMAGE LIGHTBOX FUNCTIONS
    function expandImage(url) {
      const lightbox = document.getElementById('imageLightbox');
      const lightboxImg = document.getElementById('lightboxImage');
      lightboxImg.src = url;
      lightbox.classList.remove('hidden');
    }

    function closeImageLightbox() {
      document.getElementById('imageLightbox').classList.add('hidden');
      document.getElementById('lightboxImage').src = '';
    }

    // SWITCH AUTH TAB (Login / Register)
    function switchAuthTab(type) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const tabLoginBtn = document.getElementById('tabLoginBtn');
      const tabRegisterBtn = document.getElementById('tabRegisterBtn');

      if (type === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        tabLoginBtn.className = "flex-1 py-2 font-semibold text-indigo-600 border-b-2 border-indigo-600 transition";
        tabRegisterBtn.className = "flex-1 py-2 font-semibold text-slate-400 hover:text-slate-600 transition";
      } else {
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        tabRegisterBtn.className = "flex-1 py-2 font-semibold text-indigo-600 border-b-2 border-indigo-600 transition";
        tabLoginBtn.className = "flex-1 py-2 font-semibold text-slate-400 hover:text-slate-600 transition";
      }
    }

    // CATEGORY FILTERING
    function filterCategory(categoryName) {
      currentCategory = categoryName;

      showView('dashboardView');

      const buttons = document.querySelectorAll('.cat-btn');
      buttons.forEach(btn => {
        if (btn.innerText.includes(categoryName)) {
          btn.className = "cat-btn active bg-indigo-600 text-white px-4 py-1.5 rounded-full text-sm font-medium";
        } else if (!btn.id.includes('queueTab')) {
          btn.className = "cat-btn bg-white border border-slate-300 px-4 py-1.5 rounded-full text-sm font-medium";
        }
      });

      fetchArticles();
    }

    // FETCH ARTICLES WITH FILTERS & SEARCH
    async function fetchArticles() {
      const searchInput = document.getElementById('searchInput')?.value?.trim();

      let query = supabaseClient
        .from('articles')
        .select('*')
        .order('created_at', { ascending: false });

      if (currentCategory === 'Queue') {
        query = query.eq('status', 'pending');
      } else {
        // Fetch published articles OR articles belonging to the current uploader (so they see rejected/pending feedback)
        if (currentUser) {
          query = query.or(`status.eq.published,status.is.null,author_email.eq.${currentUser.email}`);
        } else {
          query = query.or('status.eq.published,status.is.null');
        }
        
        if (currentCategory && currentCategory !== 'All') {
          query = query.eq('category', currentCategory);
        }
      }

      if (searchInput) {
        query = query.or(`title.ilike.%${searchInput}%,content.ilike.%${searchInput}%`);
      }

      const { data: articles, error } = await query;

      if (error) {
        console.error('Error fetching articles:', error);
        return;
      }

      renderArticles(articles || []);
      updateQueueCount();
    }

    // FETCH QUEUE COUNT FOR SUPERVISOR/ADMIN
    async function updateQueueCount() {
      if (userRole === 'Supervisor' || userRole === 'Admin') {
        const { count, error } = await supabaseClient
          .from('articles')
          .select('*', { count: 'exact', head: true })
          .eq('status', 'pending');

        if (!error) {
          const queueCountElem = document.getElementById('queueCount');
          if (queueCountElem) queueCountElem.innerText = count || 0;
        }
      }
    }

    // RENDER CARDS TO DASHBOARD
    function renderArticles(articles) {
      const grid = document.getElementById('dashboardView');
      grid.innerHTML = '';

      if (articles.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">No articles found in this category.</div>`;
        return;
      }

      articles.forEach(art => {
        const isQueue = art.status === 'pending';
        const isSupervisor = (userRole === 'Supervisor' || userRole === 'Admin');
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl p-5 shadow-sm border border-slate-200 hover:shadow-md transition flex flex-col justify-between cursor-pointer";
        
        const cleanTitle = (art.title || 'Untitled').replace(/'/g, "\\'");

        let cardHTML = `
          <div>
            <div class="flex justify-between items-start mb-3">
              <span class="text-xs font-bold px-2.5 py-1 rounded-md ${isQueue ? 'bg-amber-100 text-amber-800' : 'bg-indigo-50 text-indigo-600'}">${art.category || 'General'}</span>
              <span class="text-xs text-slate-400">${art.created_at ? new Date(art.created_at).toLocaleDateString() : 'Recent'}</span>
            </div>
            <h3 class="font-bold text-lg text-slate-900 mb-2">${art.title || 'Untitled Article'}</h3>
            <p class="text-slate-600 text-sm line-clamp-3 mb-4">${art.content || 'No content available.'}</p>
          </div>
        `;

        // UPLOADER STATUS / FEEDBACK BANNER
        if (currentUser && art.author_email === currentUser.email) {
          if (art.status === 'rejected' && art.feedback) {
            cardHTML += `
              <div class="mt-2 p-2.5 bg-rose-50 border border-rose-200 rounded-lg text-xs text-rose-800">
                <strong>⚠️ Rejected by Supervisor:</strong> ${art.feedback}
              </div>
            `;
          } else if (art.status === 'pending') {
            cardHTML += `
              <div class="mt-2 p-2 bg-amber-50 border border-amber-200 rounded-lg text-xs text-amber-800">
                ⏳ Under Supervisor Review
              </div>
            `;
          }
        }

        // SUPERVISOR APPROVAL / REJECTION BUTTONS
        if (isQueue && isSupervisor) {
          cardHTML += `
            <div class="flex gap-2 pt-3 border-t border-slate-100 mt-3">
              <button onclick="event.stopPropagation(); approveArticle(${art.id}, '${cleanTitle}')" class="flex-1 bg-emerald-600 text-white text-xs font-bold py-2 rounded-lg">Approve</button>
              <button onclick="event.stopPropagation(); rejectArticle(${art.id}, '${cleanTitle}')" class="flex-1 bg-rose-600 text-white text-xs font-bold py-2 rounded-lg">Reject</button>
            </div>
          `;
        }

        card.innerHTML = cardHTML;
        card.onclick = () => openArticlePage(art);
        grid.appendChild(card);
      });
    }

    // OPEN SINGLE ARTICLE PAGE
    function openArticlePage(art) {
      const detail = document.getElementById('articleDetail');
      const isSupervisor = (userRole === 'Supervisor' || userRole === 'Admin');
      
      detail.innerHTML = `
        <div class="flex justify-between items-start mb-4">
          <span class="bg-indigo-100 text-indigo-700 font-bold text-xs px-3 py-1 rounded-full">${art.category || 'General'}</span>
          ${isSupervisor ? `<button onclick="deleteArticle(${art.id})" class="text-rose-600 text-sm font-semibold hover:underline">Delete Article</button>` : ''}
        </div>
        
        <h1 class="text-3xl font-extrabold text-slate-900 mb-2">${art.title}</h1>
        <div class="text-xs text-slate-400 mb-6">By ${art.author_email || 'IT Staff'} • ${new Date(art.created_at).toLocaleString()}</div>
        
        ${art.status === 'rejected' && art.feedback ? `
          <div class="mb-6 p-4 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-900">
            <strong class="font-bold text-rose-700 block mb-1">⚠️ Rejection Feedback from Supervisor:</strong>
            ${art.feedback}
          </div>
        ` : ''}

        ${art.image_url ? `
          <div class="mb-6 flex flex-col items-center group">
            <div class="relative overflow-hidden rounded-xl border border-slate-200 shadow-sm cursor-zoom-in bg-slate-50 inline-block">
              <img src="${art.image_url}" onclick="expandImage('${art.image_url}')" class="h-80 max-w-full object-contain transition duration-200 group-hover:scale-105">
              <div onclick="expandImage('${art.image_url}')" class="absolute bottom-2 right-2 bg-slate-900/70 text-white text-[11px] px-2.5 py-1 rounded-md opacity-0 group-hover:opacity-100 transition">
                🔍 Click to Expand
              </div>
            </div>
            <span class="text-xs text-slate-400 mt-1">Click photo to open full view</span>
          </div>
        ` : ''}
        
        <div class="prose max-w-none text-slate-700 whitespace-pre-line leading-relaxed">${art.content}</div>
      `;
      showView('articleView');
    }

    // SUBMIT NEW ARTICLE WITH IMAGE UPLOAD
    async function handleArticleSubmit(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      try {
        const title = document.getElementById('artTitle').value;
        const category = document.getElementById('artCategory').value;
        const content = document.getElementById('artContent').value;
        const fileInput = document.getElementById('artImage');
        let imageUrl = null;

        if (fileInput && fileInput.files && fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const filePath = `public/${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
          
          const { data: uploadData, error: uploadError } = await supabaseClient.storage
            .from('kb-image')
            .upload(filePath, file);

          if (uploadError) {
            alert("Image Upload Failed: " + uploadError.message);
            console.error("Storage upload error:", uploadError);
            return;
          }

          const { data: urlData } = supabaseClient.storage.from('kb-image').getPublicUrl(filePath);
          imageUrl = urlData.publicUrl;
        }

        const { data, error } = await supabaseClient.from('articles').insert([
          {
            title: title,
            category: category,
            content: content,
            image_url: imageUrl,
            status: 'pending',
            author_email: currentUser ? currentUser.email : 'tech@company.com'
          }
        ]);

        if (error) {
          alert("SUPABASE ERROR:\nCode: " + error.code + "\nMessage: " + error.message);
          console.error("Full Supabase Insert Error:", error);
        } else {
          alert('Submitted successfully! Article sent to Supervisor Review Queue.');
          closeModal('articleModal');
          document.getElementById('articleForm').reset();
          fetchArticles();
        }
      } catch (err) {
        alert("System Error: " + err.message);
      }
    }

    // SUPERVISOR APPROVAL ACTIONS & HISTORY LOGGING
    async function approveArticle(id, title) {
      const { error } = await supabaseClient.from('articles').update({ status: 'published' }).eq('id', id);
      
      if (error) {
        alert("Error approving article: " + error.message);
        return;
      }

      // Record Audit History
      await supabaseClient.from('approval_history').insert([{
        article_id: id,
        article_title: title || ('Article #' + id),
        action: 'approved',
        reviewer_email: currentUser ? currentUser.email : 'Supervisor',
        feedback: 'Approved for publication'
      }]);

      alert('Article approved!');
      fetchArticles();
    }

    async function rejectArticle(id, title) {
      const reason = prompt('Enter rejection feedback for the Tech:');
      if (reason) {
        const { error } = await supabaseClient.from('articles').update({ 
          status: 'rejected', 
          feedback: reason 
        }).eq('id', id);

        if (error) {
          alert("Error rejecting article: " + error.message);
          return;
        }

        // Record Audit History
        await supabaseClient.from('approval_history').insert([{
          article_id: id,
          article_title: title || ('Article #' + id),
          action: 'rejected',
          reviewer_email: currentUser ? currentUser.email : 'Supervisor',
          feedback: reason
        }]);

        alert('Rejection feedback sent to the uploader.');
        fetchArticles();
      }
    }

    async function deleteArticle(id) {
      if (confirm('Permanently delete this article?')) {
        await supabaseClient.from('articles').delete().eq('id', id);
        showView('dashboardView');
        fetchArticles();
      }
    }

    // OPEN APPROVAL HISTORY MODAL (SUPERVISOR/ADMIN)
    async function openApprovalHistory() {
      document.getElementById('historyModal').classList.remove('hidden');
      const container = document.getElementById('historyList');
      container.innerHTML = '<p class="text-sm text-slate-400 py-4 text-center">Loading audit history...</p>';

      const { data, error } = await supabaseClient
        .from('approval_history')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !data || !data.length) {
        container.innerHTML = '<p class="text-sm text-slate-400 py-4 text-center">No approval history logs found.</p>';
        return;
      }

      container.innerHTML = data.map(item => `
        <div class="p-3 border rounded-xl flex justify-between items-start text-xs ${item.action === 'approved' ? 'bg-emerald-50/50 border-emerald-200' : 'bg-rose-50/50 border-rose-200'}">
          <div>
            <span class="font-bold uppercase tracking-wider ${item.action === 'approved' ? 'text-emerald-700' : 'text-rose-700'}">${item.action}</span>
            <h4 class="font-bold text-sm text-slate-800 mt-0.5">${item.article_title || 'Article #' + item.article_id}</h4>
            <p class="text-slate-600 mt-1"><strong>Feedback:</strong> ${item.feedback || 'None'}</p>
          </div>
          <div class="text-right text-slate-400">
            <div>${item.reviewer_email || 'Unknown'}</div>
            <div>${new Date(item.created_at).toLocaleString()}</div>
          </div>
        </div>
      `).join('');
    }

    // HANDLE USER REGISTRATION
    async function handleRegister(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const role = document.getElementById('regRole').value;

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: { role: role }
        }
      });

      if (error) {
        alert("Registration Failed: " + error.message);
      } else {
        alert(`Account created successfully as ${role}! You can now sign in.`);
        switchAuthTab('login');
        document.getElementById('registerForm').reset();
      }
    }

    // HANDLE USER LOGIN
    async function handleLogin(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      const emailInput = document.getElementById('loginEmail');
      const passwordInput = document.getElementById('loginPassword');

      if (!emailInput || !passwordInput) {
        alert("Login inputs not found in DOM.");
        return;
      }

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        alert("Login Failed: " + error.message);
        console.error("Auth error details:", error);
      } else if (data?.user) {
        currentUser = data.user;
        userRole = data.user.user_metadata?.role || 'IT Staff';
        
        showAppUI();
        fetchArticles();
      }
    }

    // SHOW MAIN DASHBOARD UI
    function showAppUI() {
      document.getElementById('authView').classList.add('hidden');
      document.getElementById('appContainer').classList.remove('hidden');
      
      const userBadge = document.getElementById('userBadge');
      if (currentUser) {
        userBadge.innerText = `${currentUser.email} (${userRole})`;
      }

      updateUIForRole();
    }

    // UPDATE UI PERMISSIONS BASED ON ROLE
    function updateUIForRole() {
      const queueTab = document.getElementById('queueTab');
      const historyBtn = document.getElementById('historyBtn');

      if (userRole === 'Supervisor' || userRole === 'Admin') {
        if (queueTab) queueTab.classList.remove('hidden');
        if (historyBtn) historyBtn.classList.remove('hidden');
      } else {
        if (queueTab) queueTab.classList.add('hidden');
        if (historyBtn) historyBtn.classList.add('hidden');
      }
    }

    // LOGOUT FUNCTION
    async function handleLogout() {
      await supabaseClient.auth.signOut();
      currentUser = null;
      userRole = 'IT Staff';
      document.getElementById('appContainer').classList.add('hidden');
      document.getElementById('authView').classList.remove('hidden');
      document.getElementById('loginForm').reset();
    }

    // CHECK EXISTING SESSION ON PAGE REFRESH
    async function checkUserSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (session) {
        currentUser = session.user;
        userRole = currentUser.user_metadata?.role || 'IT Staff';
        showAppUI();
        fetchArticles();
      } else {
        document.getElementById('authView').classList.remove('hidden');
        document.getElementById('appContainer').classList.add('hidden');
      }
    }

    // LISTEN FOR AUTH CHANGES
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') {
        currentUser = null;
        userRole = 'IT Staff';
        document.getElementById('appContainer').classList.add('hidden');
        document.getElementById('authView').classList.remove('hidden');
      }
    });

    // INITIAL LOAD CHECK
    checkUserSession();

  </script>
</body>
</html>
