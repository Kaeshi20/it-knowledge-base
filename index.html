<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT Knowledge Base</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen">

  <!-- AUTH VIEW -->
  <div id="authView" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-slate-900">IT Knowledge Base</h1>
        <p class="text-slate-500 text-sm mt-1">Sign in or register to access the portal</p>
      </div>

      <!-- Auth Tabs -->
      <div class="flex border-b border-slate-200 mb-6">
        <button id="tabLoginBtn" onclick="switchAuthTab('login')" class="flex-1 py-2 font-semibold text-indigo-600 border-b-2 border-indigo-600 transition">Sign In</button>
        <button id="tabRegisterBtn" onclick="switchAuthTab('register')" class="flex-1 py-2 font-semibold text-slate-400 hover:text-slate-600 transition">Register</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Email</label>
          <input type="email" id="loginEmail" required class="w-full px-4 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Password</label>
          <input type="password" id="loginPassword" required class="w-full px-4 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="flex justify-end">
          <button type="button" onclick="openForgotPasswordModal()" class="text-xs text-indigo-600 hover:underline">Forgot password?</button>
        </div>
        <button type="submit" class="w-full py-2.5 bg-indigo-600 text-white rounded-xl font-semibold shadow-md hover:bg-indigo-700 transition">Sign In</button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Email</label>
          <input type="email" id="regEmail" required class="w-full px-4 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Password</label>
          <input type="password" id="regPassword" required class="w-full px-4 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Role</label>
          <select id="regRole" class="w-full px-4 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="IT Staff">IT Staff</option>
            <option value="IT Senior">IT Senior</option>
            <option value="Admin">Admin</option>
          </select>
        </div>
        <button type="submit" class="w-full py-2.5 bg-indigo-600 text-white rounded-xl font-semibold shadow-md hover:bg-indigo-700 transition">Create Account</button>
      </form>
    </div>
  </div>

  <!-- APP CONTAINER -->
  <div id="appContainer" class="hidden min-h-screen flex-col">
    <!-- Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer" onclick="filterCategory('all')">
          <div class="bg-indigo-600 text-white p-2 rounded-xl font-bold text-lg">KB</div>
          <span class="font-bold text-lg text-slate-900">IT Knowledge Base</span>
        </div>
        <div class="flex items-center gap-4">
          <span id="userBadge" class="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full font-medium"></span>
          <button onclick="openModal('articleModal')" class="bg-indigo-600 text-white px-4 py-1.5 rounded-xl text-xs font-semibold shadow hover:bg-indigo-700 transition">+ New Article</button>
          <button onclick="openMyUploadsView()" class="text-xs font-semibold text-slate-600 hover:text-indigo-600">My Uploads</button>
          <button id="historyBtn" onclick="openApprovalHistory()" class="hidden text-xs font-semibold text-slate-600 hover:text-indigo-600">Audit Logs</button>
          <button onclick="handleLogout()" class="text-xs font-semibold text-rose-600 hover:text-rose-800">Logout</button>
        </div>
      </div>
    </header>

    <!-- Content Body -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
      <!-- DASHBOARD VIEW -->
      <div id="dashboardView">
        <!-- Category Filter Tabs -->
        <div class="flex flex-wrap gap-2 mb-6">
          <button onclick="filterCategory('all')" class="cat-btn bg-white border border-slate-200 text-slate-600 px-5 py-1.5 rounded-full text-xs font-semibold hover:border-slate-300">All</button>
          <button onclick="filterCategory('Hardware')" class="cat-btn bg-white border border-slate-200 text-slate-600 px-5 py-1.5 rounded-full text-xs font-semibold hover:border-slate-300">Hardware</button>
          <button onclick="filterCategory('Software')" class="cat-btn bg-white border border-slate-200 text-slate-600 px-5 py-1.5 rounded-full text-xs font-semibold hover:border-slate-300">Software</button>
          <button onclick="filterCategory('Network')" class="cat-btn bg-white border border-slate-200 text-slate-600 px-5 py-1.5 rounded-full text-xs font-semibold hover:border-slate-300">Network</button>
          <button id="queueTab" onclick="filterCategory('pending')" class="cat-btn hidden bg-amber-50 border border-amber-200 text-amber-700 px-5 py-1.5 rounded-full text-xs font-semibold">
            Pending Queue (<span id="queueCount">0</span>)
          </button>
        </div>

        <!-- Grid of Articles -->
        <div id="articlesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </div>

      <!-- ARTICLE DETAIL VIEW -->
      <div id="articleView" class="hidden max-w-3xl mx-auto bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
        <button onclick="showView('dashboardView')" class="mb-6 text-xs font-semibold text-indigo-600 hover:underline">← Back to Dashboard</button>
        <div id="articleDetail"></div>
      </div>

      <!-- MY UPLOADS VIEW -->
      <div id="myUploadsView" class="hidden">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-xl font-bold text-slate-900">My Uploads</h2>
          <button onclick="confirmDeleteAllMyUploads()" class="text-xs bg-rose-50 text-rose-600 border border-rose-200 px-3 py-1.5 rounded-xl font-semibold hover:bg-rose-100">Delete All My Uploads</button>
        </div>
        <div id="myArticlesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </div>
    </main>
  </div>

  <!-- ARTICLE MODAL -->
  <div id="articleModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-xl shadow-2xl border border-slate-100">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-lg text-slate-900">Create Knowledge Base Article</h3>
        <button onclick="closeModal('articleModal')" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>

      <form id="articleForm" onsubmit="handleArticleSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Title</label>
          <input type="text" id="artTitle" required class="w-full px-4 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Category</label>
          <select id="artCategory" class="w-full px-4 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="Hardware">Hardware</option>
            <option value="Software">Software</option>
            <option value="Network">Network</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Content Formatting</label>
          <div class="flex gap-2 mb-2">
            <button type="button" onclick="formatText('b')" class="px-3 py-1 bg-slate-100 text-xs font-bold rounded hover:bg-slate-200">B</button>
            <button type="button" onclick="formatText('i')" class="px-3 py-1 bg-slate-100 text-xs italic rounded hover:bg-slate-200">I</button>
            <button type="button" onclick="applyHeader('h2')" class="px-3 py-1 bg-slate-100 text-xs font-bold rounded hover:bg-slate-200">H2</button>
          </div>
          <textarea id="artContent" rows="6" required class="w-full px-4 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Attach Image (Optional)</label>
          <input type="file" id="artImage" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closeModal('articleModal')" class="px-4 py-2 text-xs font-semibold text-slate-500 hover:text-slate-700">Cancel</button>
          <button type="submit" class="px-5 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold hover:bg-indigo-700 shadow">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <!-- FORGOT PASSWORD MODAL -->
  <div id="forgotPasswordModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl border border-slate-100">
      <h3 class="font-bold text-lg text-slate-900 mb-2">Reset Password</h3>
      <p class="text-slate-500 text-xs mb-4">Enter your registered email to receive a password recovery link.</p>
      <form onsubmit="submitForgotPassword(event)" class="space-y-4">
        <input type="email" id="resetEmailInput" required placeholder="name@company.com" class="w-full px-4 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        <div class="flex justify-end gap-2">
          <button type="button" onclick="closeForgotPasswordModal()" class="px-4 py-2 text-xs font-semibold text-slate-500">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold hover:bg-indigo-700">Send Reset Link</button>
        </div>
      </form>
    </div>
  </div>

  <!-- AUDIT HISTORY MODAL -->
  <div id="historyModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-2xl shadow-2xl border border-slate-100 max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-lg text-slate-900">Supervisor Audit History</h3>
        <button onclick="closeModal('historyModal')" class="text-slate-400 hover:text-slate-600">✕</button>
      </div>
      <div id="historyList" class="overflow-y-auto space-y-3 flex-1 pr-2"></div>
    </div>
  </div>

  <!-- SCRIPT -->
  <script>
    // --- Global State & Supabase Setup ---
    const SUPABASE_URL = 'https://wswhxeagkqaqggilbnmk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_lgVCXvLGHSPfLfF_gkRXnA_hoUX2Sq-';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let userRole = 'IT Staff';
    let currentCategory = 'all';
    let myArticlesCache = [];

    // Helper to check supervisor/admin role
    function isElevatedUser() {
      if (!currentUser) return false;
      const role = currentUser.user_metadata?.role || userRole;
      return role === 'IT Senior' || role === 'Admin';
    }

    // --- Modal Toggles ---
    function openModal(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.remove('hidden');
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.add('hidden');
    }

    function openForgotPasswordModal() {
      openModal('forgotPasswordModal');
    }

    function closeForgotPasswordModal() {
      closeModal('forgotPasswordModal');
    }

    // --- Step 1: Request Reset Email ---
    async function submitForgotPassword(event) {
      if (event) event.preventDefault();
      const email = document.getElementById('resetEmailInput').value;

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: 'https://kaeshi20.github.io/it-knowledge-base/',
      });

      if (error) {
        alert("Error: " + error.message);
      } else {
        alert("Password reset link sent! Check your email inbox.");
        closeForgotPasswordModal();
      }
    }

    // --- Views Navigation ---
    function showView(viewId) {
      const views = ['dashboardView', 'articleView', 'myUploadsView'];
      views.forEach(v => {
        const elem = document.getElementById(v);
        if (elem) elem.classList.add('hidden');
      });
      const target = document.getElementById(viewId);
      if (target) target.classList.remove('hidden');
    }

    // --- Fetch Articles ---
    async function fetchArticles() {
      let query = supabaseClient.from('articles').select('*');

      if (currentCategory === 'pending') {
        query = query.eq('status', 'pending');
      } else if (currentCategory !== 'all') {
        query = query.eq('category', currentCategory).eq('status', 'published');
      } else {
        query = query.eq('status', 'published');
      }

      const { data, error } = await query.order('created_at', { ascending: false });

      if (error) {
        console.error("Error fetching articles:", error);
        return;
      }

      renderArticles(data);
      updateQueueCount();
    }

    function renderArticles(articles) {
      const grid = document.getElementById('articlesGrid');
      if (!grid) return;
      grid.innerHTML = '';

      if (!articles || articles.length === 0) {
        grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-10">No articles found in this section.</p>`;
        return;
      }

      articles.forEach(art => {
        const card = document.createElement('div');
        card.className = "bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between relative";

        let statusBadge = '';
        if (art.status === 'pending') {
          statusBadge = `<span class="bg-amber-100 text-amber-700 text-xs px-2.5 py-0.5 rounded-full font-bold">Pending Approval</span>`;
        } else if (art.status === 'rejected') {
          statusBadge = `<span class="bg-rose-100 text-rose-700 text-xs px-2.5 py-0.5 rounded-full font-bold">Rejected</span>`;
        } else {
          statusBadge = `<span class="bg-indigo-50 text-indigo-600 text-xs px-2.5 py-0.5 rounded-full font-semibold">${art.category || 'General'}</span>`;
        }

        // Replace this block inside renderArticles(articles):
let cardHTML = `
  <div>
    <div class="flex justify-between items-center mb-3 pr-8">
      ${statusBadge}
      <span class="text-xs text-slate-400">${new Date(art.created_at).toLocaleDateString()}</span>
    </div>
    
    <button onclick="event.stopPropagation(); confirmDeleteSingleUpload(${art.id})" title="Delete Article" class="absolute top-4 right-3 text-slate-300 hover:text-rose-600 transition p-1 z-10">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
    </button>

    <h3 class="font-bold text-lg text-slate-900 mb-2">${art.title}</h3>
    <p class="text-slate-600 text-sm line-clamp-3 mb-4 whitespace-pre-wrap">${art.content}</p>
  </div>
`;

        if (art.status === 'rejected' && art.feedback) {
          cardHTML += `
            <div class="mt-2 p-3 bg-rose-50 border border-rose-200 rounded-xl text-xs text-rose-800">
              <strong class="font-bold block mb-1">Supervisor Rejection Feedback:</strong>
              "${art.feedback}"
            </div>
          `;
        }

        card.innerHTML = cardHTML;
        card.onclick = () => openArticlePage(art);
        grid.appendChild(card);
      });
    }

    async function openMyUploadsView() {
      showView('myUploadsView');
      if (!currentUser) return;

      const { data, error } = await supabaseClient
        .from('articles')
        .select('*')
        .eq('author_email', currentUser.email)
        .order('created_at', { ascending: false });

      if (!error) {
        myArticlesCache = data || [];
        renderArticles(myArticlesCache);
      }
    }

    async function confirmDeleteSingleUpload(articleId) {
      const confirmed = confirm("Are you sure you want to delete this article from your uploads?");
      if (!confirmed) return;

      const { error } = await supabaseClient.from('articles').delete().eq('id', articleId);

      if (error) {
        alert("Error deleting article: " + error.message);
      } else {
        alert("Article deleted successfully!");
        openMyUploadsView();
      }
    }

    async function confirmDeleteAllMyUploads() {
      if (!myArticlesCache || myArticlesCache.length === 0) {
        alert("You don't have any uploads to delete.");
        return;
      }

      const confirmed = confirm("⚠️ WARNING: Are you sure you want to delete ALL of your uploaded articles? This action cannot be undone.");
      if (!confirmed) return;

      const { error } = await supabaseClient
        .from('articles')
        .delete()
        .eq('author_email', currentUser.email);

      if (error) {
        alert("Error deleting uploads: " + error.message);
      } else {
        alert("All your uploaded articles have been deleted.");
        openMyUploadsView();
      }
    }

    function openArticlePage(art) {
      const detail = document.getElementById('articleDetail');
      const isSupervisor = isElevatedUser();
      
      detail.innerHTML = `
        <div class="flex justify-between items-start mb-4">
          <span class="bg-indigo-100 text-indigo-700 font-bold text-xs px-3 py-1 rounded-full">${art.category || 'General'}</span>
          ${isSupervisor ? `<button onclick="deleteArticle(${art.id})" class="text-rose-600 text-sm font-semibold hover:underline">Delete Article</button>` : ''}
        </div>
        
        <h1 class="text-3xl font-extrabold text-slate-900 mb-2">${art.title}</h1>
        <div class="text-xs text-slate-400 mb-6">By ${art.author_email || 'IT Staff'} • ${new Date(art.created_at).toLocaleString()}</div>
        
        ${art.image_url ? `
          <div class="mb-6 flex flex-col items-center">
            <img src="${art.image_url}" class="h-80 max-w-full object-contain rounded-xl border border-slate-200 shadow-sm">
          </div>
        ` : ''}
        
        <div class="prose max-w-none text-slate-700 leading-relaxed whitespace-pre-wrap">${art.content}</div>
      `;
      showView('articleView');
    }

    async function handleArticleSubmit(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      try {
        const title = document.getElementById('artTitle').value;
        const category = document.getElementById('artCategory').value;
        const content = document.getElementById('artContent').value;
        const fileInput = document.getElementById('artImage');
        let imageUrl = null;

        if (fileInput && fileInput.files && fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const filePath = `public/${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
          
          const { data: uploadData, error: uploadError } = await supabaseClient.storage
            .from('kb-image')
            .upload(filePath, file);

          if (uploadError) {
            alert("Image Upload Failed: " + uploadError.message);
            return;
          }

          const { data: urlData } = supabaseClient.storage.from('kb-image').getPublicUrl(filePath);
          imageUrl = urlData.publicUrl;
        }

        const targetStatus = isElevatedUser() ? 'published' : 'pending';

        const { data, error } = await supabaseClient.from('articles').insert([
          {
            title: title,
            category: category,
            content: content,
            image_url: imageUrl,
            status: targetStatus,
            author_email: currentUser ? currentUser.email : 'tech@company.com'
          }
        ]);

        if (error) {
          alert("SUPABASE ERROR: " + error.message);
        } else {
          if (isElevatedUser()) {
            alert('Article published successfully!');
          } else {
            alert('Submitted successfully! You can track its approval status under "My Uploads".');
          }
          closeModal('articleModal');
          document.getElementById('articleForm').reset();
          fetchArticles();
        }
      } catch (err) {
        alert("System Error: " + err.message);
      }
    }

    async function approveArticle(id, title, authorEmail) {
      const { error } = await supabaseClient.from('articles').update({ status: 'published' }).eq('id', id);
      
      if (error) {
        alert("Error approving article: " + error.message);
        return;
      }

      await supabaseClient.from('approval_history').insert([{
        article_id: id,
        article_title: title || ('Article #' + id),
        article_author: authorEmail,
        action: 'approved',
        reviewer_email: currentUser ? currentUser.email : 'Supervisor',
        feedback: 'Approved for publication'
      }]);

      alert('Article approved!');
      fetchArticles();
    }

    async function rejectArticle(id, title, authorEmail) {
      const reason = prompt('Enter rejection feedback for the author:');
      if (reason) {
        const { error } = await supabaseClient.from('articles').update({ 
          status: 'rejected', 
          feedback: reason 
        }).eq('id', id);

        if (error) {
          alert("Error rejecting article: " + error.message);
          return;
        }

        await supabaseClient.from('approval_history').insert([{
          article_id: id,
          article_title: title || ('Article #' + id),
          article_author: authorEmail,
          action: 'rejected',
          reviewer_email: currentUser ? currentUser.email : 'Supervisor',
          feedback: reason
        }]);

        alert('Rejection feedback recorded. Sent to author notification bell.');
        fetchArticles();
      }
    }

    async function deleteArticle(id) {
      if (confirm('Permanently delete this article?')) {
        await supabaseClient.from('articles').delete().eq('id', id);
        showView('dashboardView');
        fetchArticles();
      }
    }

    async function openApprovalHistory() {
      document.getElementById('historyModal').classList.remove('hidden');
      const container = document.getElementById('historyList');
      container.innerHTML = '<p class="text-sm text-slate-400 py-4 text-center">Loading audit history...</p>';

      const { data, error } = await supabaseClient
        .from('approval_history')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !data || !data.length) {
        container.innerHTML = '<p class="text-sm text-slate-400 py-4 text-center">No approval history logs found.</p>';
        return;
      }

      container.innerHTML = data.map(item => `
        <div class="p-3 border rounded-xl flex justify-between items-start text-xs ${item.action === 'approved' ? 'bg-emerald-50/50 border-emerald-200' : 'bg-rose-50/50 border-rose-200'}">
          <div>
            <span class="font-bold uppercase tracking-wider ${item.action === 'approved' ? 'text-emerald-700' : 'text-rose-700'}">${item.action}</span>
            <h4 class="font-bold text-sm text-slate-800 mt-0.5">${item.article_title || 'Article #' + item.article_id}</h4>
            <p class="text-slate-500 mt-0.5">Author: ${item.article_author || 'Unknown'}</p>
            <p class="text-slate-600 mt-1"><strong>Feedback:</strong> ${item.feedback || 'None'}</p>
          </div>
          <div class="text-right text-slate-400">
            <div>By: ${item.reviewer_email || 'Supervisor'}</div>
            <div>${new Date(item.created_at).toLocaleString()}</div>
          </div>
        </div>
      `).join('');
    }

    function filterCategory(categoryName) {
      currentCategory = categoryName;

      showView('dashboardView');

      const buttons = document.querySelectorAll('.cat-btn');
      buttons.forEach(btn => {
        if (btn.innerText.trim().toLowerCase() === categoryName.toLowerCase()) {
          btn.className = "cat-btn active bg-indigo-600 text-white px-5 py-1.5 rounded-full text-xs font-semibold shadow-sm";
        } else if (!btn.id.includes('queueTab')) {
          btn.className = "cat-btn bg-white border border-slate-200 text-slate-600 px-5 py-1.5 rounded-full text-xs font-semibold hover:border-slate-300";
        }
      });

      fetchArticles();
    }

    async function updateQueueCount() {
      if (isElevatedUser()) {
        const { count, error } = await supabaseClient
          .from('articles')
          .select('*', { count: 'exact', head: true })
          .eq('status', 'pending');

        if (!error) {
          const queueCountElem = document.getElementById('queueCount');
          if (queueCountElem) queueCountElem.innerText = count || 0;
        }
      }
    }

    function switchAuthTab(type) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const tabLoginBtn = document.getElementById('tabLoginBtn');
      const tabRegisterBtn = document.getElementById('tabRegisterBtn');

      if (type === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        tabLoginBtn.className = "flex-1 py-2 font-semibold text-indigo-600 border-b-2 border-indigo-600 transition";
        tabRegisterBtn.className = "flex-1 py-2 font-semibold text-slate-400 hover:text-slate-600 transition";
      } else {
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        tabRegisterBtn.className = "flex-1 py-2 font-semibold text-indigo-600 border-b-2 border-indigo-600 transition";
        tabLoginBtn.className = "flex-1 py-2 font-semibold text-slate-400 hover:text-slate-600 transition";
      }
    }

    async function handleRegister(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const role = document.getElementById('regRole').value;

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: { role: role }
        }
      });

      if (error) {
        alert("Registration Failed: " + error.message);
      } else {
        alert(`Account created successfully as ${role}! You can now sign in.`);
        switchAuthTab('login');
        document.getElementById('registerForm').reset();
      }
    }

    async function handleLogin(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        alert("Login Failed: " + error.message);
      } else if (data?.user) {
        currentUser = data.user;
        userRole = data.user.user_metadata?.role || 'IT Staff';
        
        showAppUI();
        fetchArticles();
      }
    }

    function showAppUI() {
      document.getElementById('authView').classList.add('hidden');
      document.getElementById('appContainer').classList.remove('hidden');
      document.getElementById('appContainer').classList.add('flex');
      
      const userBadge = document.getElementById('userBadge');
      if (currentUser) {
        userRole = currentUser.user_metadata?.role || 'IT Staff';
        userBadge.innerText = `${currentUser.email} (${userRole})`;
      }

      updateUIForRole();
    }

    function updateUIForRole() {
      const queueTab = document.getElementById('queueTab');
      const historyBtn = document.getElementById('historyBtn');

      if (isElevatedUser()) {
        if (queueTab) queueTab.classList.remove('hidden');
        if (historyBtn) historyBtn.classList.remove('hidden');
      } else {
        if (queueTab) queueTab.classList.add('hidden');
        if (historyBtn) historyBtn.classList.add('hidden');
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      currentUser = null;
      userRole = 'IT Staff';
      document.getElementById('appContainer').classList.add('hidden');
      document.getElementById('appContainer').classList.remove('flex');
      document.getElementById('authView').classList.remove('hidden');
      document.getElementById('loginForm').reset();
    }

    async function checkUserSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (session) {
        currentUser = session.user;
        userRole = currentUser.user_metadata?.role || 'IT Staff';
        showAppUI();
        fetchArticles();
      } else {
        document.getElementById('authView').classList.remove('hidden');
        document.getElementById('appContainer').classList.add('hidden');
        document.getElementById('appContainer').classList.remove('flex');
      }
    }

    checkUserSession();

    function formatText(tag) {
      const textarea = document.getElementById('artContent');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const selectedText = textarea.value.substring(start, end);

      if (!selectedText) return;

      const replacement = `<${tag}>${selectedText}</${tag}>`;
      textarea.value = textarea.value.substring(0, start) + replacement + textarea.value.substring(end);
    }

    function applyHeader(tag) {
      if (!tag) return;
      const textarea = document.getElementById('artContent');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const selectedText = textarea.value.substring(start, end);

      if (!selectedText) return;

      const replacement = `<${tag}>${selectedText}</${tag}>`;
      textarea.value = textarea.value.substring(0, start) + replacement + textarea.value.substring(end);
    }
  </script>
</body>
</html>
